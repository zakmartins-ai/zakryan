</html Configurações Globais
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

/* Fundo Dinâmico Animado */
body {
  background: linear-gradient(-45deg, #02121e, #083344, #0e7490, #155e75);
  background-size: 400% 400%;
  animation: oceanFlow 15s ease infinite;
  color: #ecfeff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@keyframes oceanFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Header com Neon Líquido */
.hero {
  position: relative;
  height: 45vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
}

.content {
  text-align: center;
  padding: 0 20px;
}

.hero h1 {
  font-size: 3rem;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 0 20px rgba(34, 211, 238, 0.6), 0 0 40px rgba(6, 182, 212, 0.4);
  letter-spacing: 1px;
}

.hero p {
  margin-top: 12px;
  font-size: 1.2rem;
  color: #a5f3fc;
  font-weight: 300;
}

/* Conteúdo Principal */
.container {
  display: flex;
  justify-content: center;
  padding: 20px 20px 60px;
}

/* Card Estilo Glassmorphism */
.card {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(103, 232, 249, 0.2);
  border-radius: 20px;
  max-width: 480px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              border-color 0.4s ease, 
              box-shadow 0.4s ease;
}

/* Efeito de Elevação ao Passar o Mouse */
.card:hover {
  transform: translateY(-8px);
  border-color: rgba(34, 211, 238, 0.6);
  box-shadow: 0 30px 60px rgba(6, 182, 212, 0.25);
}

.card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid rgba(103, 232, 249, 0.3);
  margin-bottom: 24px;
  transition: transform 0.4s ease;
}

.card:hover img {
  transform: scale(1.02);
}

.card h2 {
  color: #22d3ee;
  font-size: 1.6rem;
  margin-bottom: 12px;
}

.card p {
  line-height: 1.7;
  color: #cffaff;
  font-size: 0.98rem;
}
